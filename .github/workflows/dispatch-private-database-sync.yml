# Copy into the public data repository as .github/workflows/dispatch-private-database-sync.yml
#
# After each push to master: mint a short-lived token for a GitHub App installed on the
# private platform repo, then POST repository_dispatch to bump the submodule and deploy.
#
# On the PUBLIC repository configure (Actions → Secrets only):
#   DISPATCH_APP_CLIENT_ID — GitHub App "Client ID" (numeric string from the app page).
#   DISPATCH_APP_PRIVATE_KEY — App private key PEM in PKCS#8 form (see GitHub App token docs if you need openssl conversion).
#
# GitHub App (github.com/settings/apps or org → GitHub Apps):
#   - Repository permission: Contents — Read and write (required for repository_dispatch).
#   - Metadata — Read (default).
#   - Install the app on your account/org and grant access only to the private locobox2-database repo.
#
# If the private repo slug is not locobox2-database, edit PRIVATE_PLATFORM_REPO below.

name: Dispatch private database submodule sync

on:
  workflow_run:
    workflows:
      - Validate Data
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIVATE_PLATFORM_REPO: ${{ github.repository_owner }}/locobox2-database

jobs:
  dispatch:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            locobox2-database
          permission-contents: write

      - name: Trigger repository_dispatch on private platform
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${PRIVATE_PLATFORM_REPO}/dispatches" \
            -d "{\"event_type\":\"public-data-master-updated\",\"client_payload\":{\"sha\":\"${GITHUB_SHA}\"}}"
