# After each push to master: GitHub App installation token, then repository_dispatch on the private platform repo.
#
# Public repo secrets: DISPATCH_APP_CLIENT_ID (GitHub App Client ID), DISPATCH_APP_PRIVATE_KEY (PEM PKCS#8).
# GitHub App: Contents Read and write; install only on private locobox2-database.

name: Dispatch private database submodule sync

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIVATE_PLATFORM_REPO: ${{ github.repository_owner }}/locobox2-database

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            locobox2-database
          permission-contents: write

      - name: Trigger repository_dispatch on private platform
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${PRIVATE_PLATFORM_REPO}/dispatches" \
            -d "{\"event_type\":\"public-data-master-updated\",\"client_payload\":{\"sha\":\"${GITHUB_SHA}\"}}"
