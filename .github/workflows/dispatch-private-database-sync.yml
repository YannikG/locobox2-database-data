# On push to master: trigger private platform repo to bump submodule and deploy.
# Secret DATABASE_REPO_DISPATCH_TOKEN: PAT with access to POST .../dispatches on the private repo.

name: Dispatch private database submodule sync

on:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  DATABASE_PLATFORM_REPO: YannikG/locobox2-database

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger repository_dispatch on private platform
        env:
          TOKEN: ${{ secrets.DATABASE_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "Missing secret DATABASE_REPO_DISPATCH_TOKEN on this repository."
            exit 1
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DATABASE_PLATFORM_REPO}/dispatches" \
            -d "{\"event_type\":\"public-data-master-updated\",\"client_payload\":{\"sha\":\"${GITHUB_SHA}\"}}"
