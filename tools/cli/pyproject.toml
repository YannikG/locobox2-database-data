[project]
name = "locobox-cli"
version = "0.1.0"
description = "Locobox article import CLI (queue, pipeline, shop adapters)"
readme = "README.md"
authors = [
    { name = "YannikG", email = "gartmann.yannik@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cloakbrowser>=0.6.0",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
    "typer>=0.19.0",
]

[project.scripts]
locobox = "locobox_cli.interfaces.cli.main:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true
